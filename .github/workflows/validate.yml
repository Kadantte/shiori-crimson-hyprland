name: Repository checks
on:
  pull_request:
  push:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Unit tests
        run: python3 -m unittest discover -s tests -v
      - name: Check public files and image register
        run: python3 scripts/prepublish.py
