# Shiori Crimson - Asura dual-monitor layout

# Main: LG UltraGear, left, 1440p 180Hz
monitor = {{MAIN_OUTPUT}},2560x1440@179.96,0x0,1

# Secondary: ASUS MG248, right, portrait
# Start at 60Hz for recovery; increase later
monitor = {{PORTRAIT_OUTPUT}},1920x1080@143.98,2560x0,1,transform,3

workspace = 1, monitor:{{MAIN_OUTPUT}}, default:true
workspace = 2, monitor:{{PORTRAIT_OUTPUT}}, default:true

# Shiori Crimson / Asura - Hyprland 0.53.x baseline
# This is a separate session; Ubuntu GNOME remains available via GDM.
# Change monitor layout later after checking: hyprctl monitors
# ==========================================
# SHIORI CRIMSON — MONITOR CONFIGURATION
# ==========================================

# LG ULTRAGEAR — MAIN, LEFT, 2K, 180Hz

# ASUS MG248 — SECONDARY, RIGHT, PORTRAIT, 144Hz

# Workspace assignments

$mainMod = SUPER
$terminal = kitty
$menu = wofi --show drun --allow-images

# Session-only services (not enabled globally)
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = {{HOME}}/.config/shiori-v3/start-waybar.sh
exec-once = hyprpaper
exec-once = mako
exec-once = nm-applet --indicator
exec-once = systemctl --user start hyprpolkitagent.service

input {
    follow_mouse = 1
    sensitivity = 0
    kb_layout = fr
}

general {
    gaps_in = 8
    gaps_out = 16
    border_size = 2
    col.active_border = rgba(d5232aff) rgba(f4b845ff) 45deg
    col.inactive_border = rgba(51343caa)
    layout = dwindle
    resize_on_border = true
}

decoration {
    rounding = 14
    active_opacity = 0.98
    inactive_opacity = 0.92
    blur {
        enabled = true
        size = 5
        passes = 2
    }
    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(5e0b17a0)
    }
}

animations {
    enabled = true
    bezier = shiori, 0.22, 0.86, 0.25, 1.00
    animation = windows, 1, 5, shiori, popin 85%
    animation = fade, 1, 6, shiori
    animation = workspaces, 1, 5, shiori, slide
}

dwindle {
    pseudotile = true
    preserve_split = true
}

misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# Essentials
bind = $mainMod, Return, exec, $terminal
# SHIORI_V3_ORIGINAL: bind = $mainMod, D, exec, $menu
bind = $mainMod, Q, killactive,
bind = $mainMod, V, togglefloating,
bind = $mainMod, F, fullscreen, 0
bind = $mainMod SHIFT, E, exit,
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Workspaces 1-5
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Window mouse gestures
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# PipeWire / WirePlumber. Keeps Corsair as default output and MH3 as default input.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

# Region screenshot into Pictures/Screenshots
bind = , Print, exec, sh -c 'mkdir -p "$HOME/Pictures/Screenshots"; grim -g "$(slurp)" "$HOME/Pictures/Screenshots/$(date +%Y%m%d-%H%M%S).png"'
# BEGIN SHIORI_V3
# Starts independently of Waybar; GNOME and monitors are unchanged.
exec-once = {{HOME}}/.config/shiori-v3/start.sh
bind = $mainMod, D, exec, {{HOME}}/.config/shiori-v3/launch.sh launcher
# END SHIORI_V3

# BEGIN SHIORI_V33_SESSION
# Shiori v3.3 login-only environment; no monitor/input/audio changes.
env = XDG_SESSION_TYPE,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_DATA_DIRS,{{HOME}}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share/:/usr/share/:/var/lib/snapd/desktop
exec-once = {{HOME}}/.config/shiori-v3/session-init.sh
# END SHIORI_V33_SESSION

# Shiori: reset LG cursor plane after login
# OPTIONAL ASURA-SPECIFIC DISPLAY RESET — do not enable for other machines:
# exec-once = {{HOME}}/.local/bin/shiori-cursor-reset
