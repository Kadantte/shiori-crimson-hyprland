name: Repository checks
on:
  pull_request:
  push:
    branches: [main, develop]
    tags: ["v*-beta.*"]
permissions:
  contents: read
jobs:
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Offline source beta release checks
        run: python3 scripts/beta_release_check.py
      - name: Confirm tag/version match (tag builds only)
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(cat VERSION)" = "$GITHUB_REF_NAME"
